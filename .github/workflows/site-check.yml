name: site-check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check readiness through Cloudflare and ping Healthchecks on success
        env:
          PING: ${{ secrets.HC_SITE_PING_URL }}
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 5 -A "hsabatak-uptime/1 (github-actions)" https://app.hsabatak.com/health/ready)
          echo "$body" | grep -q '"status":"ready"'
          curl -fsS --max-time 10 --retry 3 -o /dev/null "$PING"
          echo "site ready, ping sent"
