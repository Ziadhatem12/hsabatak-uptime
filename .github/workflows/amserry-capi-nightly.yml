name: amserry-capi-nightly
# Nightly safety net: asks amserry.com to send Meta any paid order whose Purchase was never sent server-side.
# Moved from kvm2 cron "0 1 * * *" Africa/Cairo (23:00 UTC).
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  capi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          K: ${{ secrets.AMSERRY_CRON_KEY }}
        run: |
          out=$(curl -sS --max-time 90 "https://amserry.com/capi-nightly.php?k=$K")
          echo "$(date -u +%FT%TZ) ${out:0:500}"
